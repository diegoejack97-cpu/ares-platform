[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ares-platform-backend"
version = "0.1.0"
description = "ARES Platform modular monolith backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.2",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "psycopg[binary]==3.3.4",
  "uvicorn[standard]==0.42.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires the local Supabase PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
