name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -e "./backend[dev]"
      - run: npm run quality
      - run: npm run supabase -- --version

  postgres:
    runs-on: ubuntu-latest
    env:
      ARES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55422/postgres
      ARES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55422/postgres
      ARES_TEST_DATABASE_DISPOSABLE: "1"
      ARES_EVENT_JOURNAL_BACKEND: postgres
      ARES_ENVIRONMENT: development
      ARES_CRM_PROVIDER: embedded_fake
      ARES_OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -e "./backend[dev]"
      # A fresh runner applies every migration and the synthetic seed. Never reset
      # a developer or customer database. Do not echo generated local credentials.
      - run: npm run db:start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: python scripts/seed-integration-tests.py
      - run: npm run db:test
      - run: python scripts/run-postgres-tests.py
      - if: always()
        run: npm run db:stop > "$RUNNER_TEMP/supabase-stop.log" 2>&1
