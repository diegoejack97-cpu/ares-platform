name: ares-presentation
services:
  crm:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "ares.fake_crm_sandbox.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
        "--no-access-log",
      ]
    environment:
      FAKE_CRM_SANDBOX_API_KEY: ${ARES_CRM_SECRET_DEMO_API:?CRM secret required}
      FAKE_CRM_SANDBOX_WEBHOOK_SECRET: ${ARES_CRM_SECRET_DEMO_WEBHOOK:?Webhook secret required}
      FAKE_CRM_STATE_FILE: /data/state.json
    volumes: [crm_data:/data]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health',timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      ARES_ENVIRONMENT: demonstration
      ARES_REQUIRE_WORKER: "true"
      ARES_BACKGROUND_EXECUTION: "false"
    command: ["python", "-m", "ares.workers.daemon"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      crm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "ares.workers.health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      ARES_ENVIRONMENT: demonstration
      ARES_REQUIRE_WORKER: "true"
      ARES_BACKGROUND_EXECUTION: "false"
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_SUPABASE_URL: ${ARES_SUPABASE_URL:?Supabase URL required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ARES_SUPABASE_PUBLISHABLE_KEY:?Publishable key required}
    environment:
      ARES_PUBLIC_HOST: ${ARES_PUBLIC_HOST:?Public hostname required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  crm_data:
  caddy_data:
  caddy_config:
